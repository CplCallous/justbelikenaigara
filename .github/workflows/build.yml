name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'artifacts/swift-launcher/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          echo "Android SDK root: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not set}}"
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release APK
        working-directory: artifacts/swift-launcher/android
        env:
          CI: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          APK="artifacts/swift-launcher/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "Expected APK was not created: $APK" >&2
            find artifacts/swift-launcher/android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-launcher-release-apk
          path: artifacts/swift-launcher/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
