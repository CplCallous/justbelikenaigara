name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'launcherreplit-with-build-workflow.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract launcher source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q launcherreplit-with-build-workflow.zip -d extracted
          echo "Archive contents (top levels):"
          find extracted -maxdepth 3 -type f | sort | head -200
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [[ -z "$GRADLEW" ]]; then
            echo "No Gradle wrapper (gradlew) was found in the source archive." >&2
            exit 1
          fi
          ANDROID_DIR="$(dirname "$GRADLEW")"
          echo "ANDROID_PROJECT_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $ANDROID_DIR"
          # Install at the archive's workspace root, where the workspace lockfile lives.
          PACKAGE_JSON="$(find extracted -mindepth 2 -maxdepth 3 -type f -name package.json -not -path '*/node_modules/*' -print | while read -r file; do dir="$(dirname "$file")"; if [[ -f "$dir/pnpm-lock.yaml" || -f "$dir/package-lock.json" || -f "$dir/yarn.lock" ]]; then echo "$file"; break; fi; done)"
          if [[ -n "$PACKAGE_JSON" ]]; then
            echo "PACKAGE_JSON_DIR=$(dirname "$PACKAGE_JSON")" >> "$GITHUB_ENV"
            echo "Found workspace package.json at $PACKAGE_JSON"
            ls -la "$(dirname "$PACKAGE_JSON")"
          else
            echo "No workspace package.json with a lockfile found." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          command -v sdkmanager
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up pnpm
        if: env.PACKAGE_JSON_DIR != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        if: env.PACKAGE_JSON_DIR != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        if: env.PACKAGE_JSON_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE_JSON_DIR"
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          else
            npm install
          fi
          echo "Installed dependencies from $PACKAGE_JSON_DIR"
          test -d node_modules

      - name: Install missing Expo config plugin dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE_JSON_DIR"
          # The bundled Swift Launcher config plugin imports this package directly,
          # but it is not declared as a direct dependency in the source archive.
          pnpm add --workspace-root --save-dev @expo/config-plugins@57.0.10
          node -e "console.log('Resolved @expo/config-plugins:', require.resolve('@expo/config-plugins'))"

      - name: Diagnose Node project resolution
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          echo "Android settings.gradle:"
          sed -n '1,100p' settings.gradle
          echo "Node and package manager versions:"
          node --version
          pnpm --version
          echo "Workspace root: $PACKAGE_JSON_DIR"
          echo "Relevant node_modules directories:"
          find "$(dirname "$ANDROID_PROJECT_DIR")" -maxdepth 3 -type d -name node_modules -print || true

      - name: Add missing Android library namespace
        shell: bash
        run: |
          set -euo pipefail
          MODULE_DIR="$(dirname "$ANDROID_PROJECT_DIR")/modules/swift-launcher/android"
          BUILD_FILE="$MODULE_DIR/build.gradle"
          if [[ -f "$BUILD_FILE" ]] && ! grep -Eq '^[[:space:]]*namespace[[:space:]]' "$BUILD_FILE"; then
            MANIFEST="$MODULE_DIR/src/main/AndroidManifest.xml"
            NAMESPACE=""
            if [[ -f "$MANIFEST" ]]; then
              NAMESPACE="$(sed -n 's/.*package=[\"'"'"']\([^\"'"'"']*\)[\"'"'"'].*/\1/p' "$MANIFEST" | head -1)"
            fi
            if [[ -z "$NAMESPACE" ]]; then
              NAMESPACE="com.swiftlauncher.nativebridge"
            fi
            echo "Adding namespace $NAMESPACE to $BUILD_FILE"
            if grep -Eq '^[[:space:]]*android[[:space:]]*\\{' "$BUILD_FILE"; then
              sed -i "/^[[:space:]]*android[[:space:]]*{/a\\    namespace '$NAMESPACE'" "$BUILD_FILE"
            else
              printf "\\nandroid {\\n    namespace '%s'\\n}\\n" "$NAMESPACE" >> "$BUILD_FILE"
            fi
            if ! grep -Eq "^[[:space:]]*namespace[[:space:]]+['\\\"]$NAMESPACE['\\\"]" "$BUILD_FILE"; then
              echo "Failed to insert namespace into $BUILD_FILE" >&2
              exit 1
            fi
          else
            echo "Namespace already exists or custom module build file is absent; no patch needed."
          fi
          # Expo autolinking reads android.defaultConfig.versionName.
          # Ensure the property is configured inside the Android extension, not at project level.
          if [[ -f "$BUILD_FILE" ]] && ! grep -Eq 'versionName[[:space:]]+' "$BUILD_FILE"; then
            printf "\\nandroid {\\n    defaultConfig {\\n        versionName '1.0.0'\\n    }\\n}\\n" >> "$BUILD_FILE"
          fi
          sed -n '1,65p' "$BUILD_FILE" 2>/dev/null || true

      - name: Fix Kotlin AsyncFunction return inference
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(dirname "$ANDROID_PROJECT_DIR")/modules/swift-launcher/android/src/main/java/expo/modules/swiftlauncher/SwiftLauncherModule.kt"
          test -f "$SOURCE"
          python3 - "$SOURCE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines(keepends=True)
          # Patch by source pattern, not fixed line numbers: line numbers shift when
          # upstream source changes. Only Promise calls inside the native module need
          # an explicit nullable return for Expo's AsyncFunction signature.
          targets = [i for i, line in enumerate(lines)
                     if re.search(r'\bpromise\.(?:resolve|reject)\s*\(', line)]
          if len(targets) != 4:
              print("PROMISE_MATCHES:", [(i + 1, lines[i].rstrip()) for i in targets], flush=True)
              print("SOURCE_CONTEXT_BEGIN", flush=True)
              for start, end in ((55, 82), (115, 140), (215, 245)):
                  print(f"LINES {start}-{end}", flush=True)
                  for n in range(start, min(end, len(lines)) + 1):
                      print(f"{n}: {lines[n-1].rstrip()}", flush=True)
              print("SOURCE_RELEVANT_LINES", flush=True)
              for n, line in enumerate(lines, 1):
                  if re.search(r'asyncfunction|promise|resolve|reject', line, re.IGNORECASE):
                      print(f"{n}: {line.rstrip()}", flush=True)
              print("SOURCE_CONTEXT_END", flush=True)
              raise SystemExit(f"Expected 4 Promise resolve/reject call sites, found {len(targets)}: " +
                               ", ".join(str(i + 1) for i in targets))
          for i in reversed(targets):
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i + 1, indent + "null\n")
          p.write_text("".join(lines))
          print(f"Added explicit null returns after {len(targets)} Promise calls.")
          PY
          grep -n -A1 -E 'promise\.(resolve|reject)\(' "$SOURCE"

      - name: Build release APK
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find extracted -type f -path '*/build/outputs/apk/release/*.apk' -size +0c -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "No non-empty release APK was created." >&2
            find extracted -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: swift-launcher-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
